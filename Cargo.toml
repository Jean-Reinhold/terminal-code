[workspace]
members = ["crates/tode-core", "crates/tode-harness"]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.98"
license = "MIT"

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"
jsonc-parser = { version = "0.33.1", features = ["serde"] }
nix = { version = "0.30", features = ["process", "signal"] }
schemars = "1.2.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
wait-timeout = "0.2"
walkdir = "2"
yaml_serde = "0.10.7"
