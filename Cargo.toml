[workspace]
members = ["crates/tode-core", "crates/tode-harness", "crates/tode-runtime"]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.98"
license = "MIT"

[workspace.dependencies]
bytes = "1"
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"
jsonc-parser = { version = "0.33.1", features = ["serde"] }
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
nix = { version = "0.30", features = ["process", "signal"] }
schemars = "1.2.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
wait-timeout = "0.2"
walkdir = "2"
yaml_serde = "0.10.7"
